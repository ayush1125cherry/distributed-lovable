apiVersion: v1
kind: Namespace
metadata:
  name: lovable-core

---

# namespace for preview
apiVersion: v1
kind: Namespace
metadata:
  name: lovable-previews

---

# config for shared config values across services
apiVersion: v1
kind: ConfigMap
metadata:
  name: lovable-shared-config
  namespace: lovable-core
data:
  PREVIEW_DOMAIN: "previews.lovable.in"
  PREVIEW_NAMESPACE: "lovable-previews"
  PROXY_PORT: "80"
  App_FRONTEND_URL: " http://ayushrawat.in"

